html,body{margin:0;height:100%;background:#111814;display:grid;place-items:center}

.ch{fill:none;stroke:#f3f1e8;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;filter:url(#chalk)}

.field{fill:#3b6fb6;opacity:0;animation:fi 1.5s forwards 3.6s}

.s{font-family:"Architects Daughter",cursive;fill:#d9d6c8;text-anchor:middle;opacity:0;animation:fi2 1.2s forwards}
@keyframes fi2{to{opacity:1}}
.rose{transform-origin:450px 720px;animation:breathe 6s ease-in-out infinite 9s}

.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}

.ty{opacity:0;animation:fi2 .05s forwards}
.blk{fill:var(--c);opacity:0;filter:url(#chalk);animation:fi2 .4s forwards var(--d)}
.ln{opacity:0;animation:fi2 1s forwards}.cmd{font-family:"Architects Daughter",cursive;fill:#f2c94c;text-anchor:middle;opacity:0;animation:fi2 1s forwards}
